[build-system]
# >=1.10: respects CLI --profile over pyproject profile and supports
# editable-profile. Earlier 1.9.x would silently invert that precedence.
requires = ["maturin>=1.10.0,<2.0.0"]
build-backend = "maturin"

[project]
name = "koi-maestro"
version = "1.0.0"
description = "High-performance Hanafuda Koi-Koi game engine and CFR/RL suite in Rust with Python bindings."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "notLukeshi" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26.0,<3.0.0",
]

[project.urls]
Repository = "https://github.com/notLukeshi/koi-maestro"

[project.optional-dependencies]
ml = [
    "torch>=2.2.0",
    "safetensors>=0.4.0",
    "onnx>=1.16.0",
    "onnxruntime>=1.17.0",
]
# pip-installable mirror of the dev dependency-group (plain `pip install -e .[dev]`
# covers pytest/ruff/mypy without requiring pip>=25.1 --group support).
dev = [
    "pytest>=8.1.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

[dependency-groups]
dev = [
    "maturin>=1.10.0,<2.0.0",
    "pytest>=8.1.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

[tool.maturin]
manifest-path = "crates/koi-pyo3/Cargo.toml"
# `extension-module` is maturin-only, not a Cargo.toml feature — an
# unconditional one would unlink the Python lib `cargo test` needs.
features = ["pyo3/extension-module"]
module-name = "koi_maestro._engine"
python-source = "src"
strip = true
# Wheel builds use release-wheel (inherits release, panic=unwind): a panic
# crossing the FFI must raise a catchable PanicException in Python, not
# abort the host interpreter. Cargo.toml is the single source of the profile.
profile = "release-wheel"
include = [
    "src/koi_maestro/py.typed",
    "src/koi_maestro/_engine.pyi",
]
# Editable installs stay on the fast dev profile; only real wheels pay the
# release-wheel certification cost (maturin >= 1.10 supports editable-profile).
editable-profile = "dev"

[tool.pytest.ini_options]
testpaths = ["src/tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]
# Generated by stub_gen — lint findings would churn on every regen.
exclude = ["src/koi_maestro/_engine.pyi"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/koi_maestro", "tests"]